<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MetaFusion MCP</title>
  <link rel="stylesheet" href="/mcp/assets/style.css">
  <script type="module" src="/mcp/assets/app.js"></script>
</head>
<body>
  <main>
    <header>
      <a href="/" class="brand">MetaFusion</a>
      <select id="language" aria-label="Language">
        <option value="zh-CN">简体中文</option>
        <option value="en-US">English</option>
        <option value="zh-TW">繁體中文</option>
        <option value="ja-JP">日本語</option>
      </select>
    </header>

    <section id="landing" hidden>
      <h1 data-i18n="landingTitle"></h1>
      <p data-i18n="landingIntro"></p>
      <div class="buttons">
        <a id="openManage" class="button" href="/mcp/manage" data-i18n="openManage"></a>
        <a id="landingLogin" class="button secondary" hidden href="/login?redirect=%2Fmcp%2Fmanage" data-i18n="login"></a>
      </div>
      <p class="meta" data-i18n="landingHint"></p>
    </section>

    <section id="manageShell" hidden>
      <h1 data-i18n="manageTitle"></h1>
      <p data-i18n="manageIntro"></p>
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="sessionBanner" class="banner" hidden>
        <p id="sessionMessage"></p>
        <a id="login" class="button" data-i18n="login"></a>
        <details id="errorDetails" class="error-details" hidden>
          <summary data-i18n="errorDetails"></summary>
          <code id="errorCode"></code>
        </details>
      </div>
      <section id="workspace" hidden>
        <p id="identity" class="meta"></p>
        <label data-i18n="endpoint"></label>
        <code id="endpoint"></code>
        <section id="consent" hidden>
          <h2 data-i18n="authorization"></h2>
          <p id="client"></p>
          <p class="warning" data-i18n="unverified"></p>
          <p id="callback" class="meta"></p>
          <div id="scopes" class="scope-groups"></div>
          <fieldset class="expiry">
            <legend data-i18n="expiry"></legend>
            <label class="chip"><input type="radio" name="days" value="7" checked> <span data-i18n="expiry7"></span></label>
            <label class="chip"><input type="radio" name="days" value="30"> <span data-i18n="expiry30"></span></label>
            <label class="chip"><input type="radio" name="days" value="custom"> <span data-i18n="expiryCustom"></span></label>
            <input id="daysCustom" type="number" min="1" max="30" value="14" hidden>
          </fieldset>
          <div class="buttons">
            <button id="approve" data-i18n="approve"></button>
            <button id="deny" class="secondary" data-i18n="deny"></button>
          </div>
        </section>
        <h2 data-i18n="grants"></h2>
        <p data-i18n="grantHelp"></p>
        <div id="grants"></div>
      </section>
    </section>

    <footer>
      <a href="/docs/api-mcp" data-i18n="docs"></a>
    </footer>
  </main>
</body>
</html>
