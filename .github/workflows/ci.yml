name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcp_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mcp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcp_test -d mcp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
        env:
          MCP_TEST_DATABASE_URL: postgres://mcp_test:test@127.0.0.1:5432/mcp_test?sslmode=disable
      - run: go vet ./...
      - run: docker build -t metafusion-mcp:test .
